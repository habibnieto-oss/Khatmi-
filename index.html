<style>
:root{
 --g:#0d5c46; --g2:#12805f; --gsoft:#e3f0ea; --ink:#1a2420; --mut:#6b7a74; --line:#dfe7e3;
 --bg:#f7faf8; --card:#ffffff; --danger:#b3372f;
 --fr-labels:'ثمن ⅛|ربع ¼|ثمن ⅜|نصف ½|ثمن ⅝|ربع ¾|ثمن ⅞|ربع · نهاية الحزب';
}
@media (prefers-color-scheme: dark){
 :root{ --ink:#e8efec; --mut:#93a49d; --line:#2c3a35; --bg:#101614; --card:#1a2320; --gsoft:#17352c; --danger:#e06c63; }
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
body{margin:0; font-family:system-ui,'Segoe UI',Roboto,sans-serif; background:var(--bg); color:var(--ink)}
[dir=rtl]{font-family:system-ui,sans-serif}
button{font:inherit; cursor:pointer; color:inherit}
.num{font-variant-numeric:tabular-nums}
#wrap{max-width:520px; margin:0 auto; padding:12px 12px 84px; display:none}
header{display:flex; align-items:center; justify-content:space-between; padding:6px 2px 12px}
header .logo{display:flex;align-items:center;gap:8px}
header .logo svg{border-radius:8px;display:block}
header .logo{font-size:22px; font-weight:700; color:var(--g)}
header .logo small{font-size:12px; color:var(--mut); font-weight:400}
.chip{border:1px solid var(--line); border-radius:20px; padding:3px 12px; font-size:13px; background:transparent; color:var(--mut)}
.chip.on{border-color:var(--g); color:var(--g); font-weight:600}
.card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:12px}
.ringwrap{display:flex; align-items:center; gap:18px}
.ring{position:relative; width:110px; height:110px; flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .txt{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center}
.ring .pct{font-size:24px; font-weight:700; color:var(--g)}
.ring .of{font-size:11px; color:var(--mut)}
.btn{background:var(--g); color:#fff; border:none; border-radius:12px; padding:12px 18px; font-weight:600; font-size:15px; width:100%}
.btn.ghost{background:transparent; border:1px solid var(--line); color:var(--ink); font-weight:400}
.btn.small{width:auto; padding:7px 12px; font-size:13px; border-radius:9px}
.targetrow{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:6px}
.qbtn{width:40px; height:40px; border-radius:12px; border:1px solid var(--line); background:var(--card); font-size:19px; color:var(--g)}
.quick{display:flex; gap:8px; margin-top:10px}
.quick .btn{padding:10px 6px; font-size:13px}
h3{font-size:13px; text-transform:uppercase; letter-spacing:.6px; color:var(--mut); margin:18px 4px 8px; font-weight:600}
.hgrid{display:grid; grid-template-columns:repeat(6,1fr); gap:8px}
.hz{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:7px 4px 5px; text-align:center}
.hz .n{font-size:13px; font-weight:600}
.hz .bar{display:flex; gap:2px; justify-content:center; margin-top:5px}
.hz .bar i{width:5px; height:9px; border-radius:2px; background:var(--line)}
.hz .bar i.d{background:var(--g2)}
.hz.done .n{color:var(--g)}
.hz.next{border:2px solid var(--g)}
.hz.lock .n{color:var(--mut)}
.trow{display:flex; align-items:center; gap:10px; padding:10px 2px; border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:none}
.tchk{width:28px; height:28px; border-radius:9px; border:2px solid var(--line); background:transparent; flex:none; display:flex; align-items:center; justify-content:center; font-size:15px; color:transparent}
.tchk.on{background:var(--g); border-color:var(--g); color:#fff}
.tmeta{flex:1; min-width:0}
.tmeta .fr{font-size:12px; color:var(--mut)}
.tmeta .ay{font-size:17px; margin-top:1px; direction:rtl; text-align:start}
.tsave{background:transparent;border:1px solid var(--line);border-radius:8px;font-size:14px;padding:3px 7px;color:var(--mut)}
.editable:empty:before{content:"✎";color:var(--line)}
.tedit{border:none; background:none; font-size:16px; color:var(--mut); padding:4px}
.sheet-head{display:flex; justify-content:space-between; align-items:flex-start; gap:8px}
.warn{background:#fdf3e7; color:#8a5a12; border:1px solid #ecd9b8; border-radius:10px; padding:8px 10px; font-size:12.5px; margin-bottom:8px}
@media (prefers-color-scheme: dark){.warn{background:#33270f; border-color:#57431a; color:#e3b96a}}
.tabs{position:fixed; bottom:0; left:0; right:0; background:var(--card); border-top:1px solid var(--line); display:flex; z-index:20}
.tabs button{flex:1; padding:10px 0 14px; background:none; border:none; font-size:12px; color:var(--mut); display:flex; flex-direction:column; align-items:center; gap:2px}
.tabs button.on{color:var(--g); font-weight:600}
.tabs .ic{font-size:19px}
.statgrid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; text-align:center}
.statgrid .v{font-size:20px; font-weight:700; color:var(--g)}
.statgrid .l{font-size:11px; color:var(--mut)}
.wbar{display:flex; align-items:flex-end; gap:6px; height:80px; margin-top:8px}
.wbar .col{flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; height:100%; justify-content:flex-end}
.wbar .b{width:100%; background:var(--g2); border-radius:4px 4px 0 0; min-height:2px}
.wbar .d{font-size:10px; color:var(--mut)}
input[type=time],input[type=number]{background:var(--card); border:1px solid var(--line); color:var(--ink); border-radius:10px; padding:8px 10px; font:inherit}
.rowline{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:9px 0; border-bottom:1px solid var(--line)}
.rowline:last-child{border:none}
.switch{position:relative; width:44px; height:26px; flex:none}
.switch input{opacity:0; width:100%; height:100%; position:absolute; margin:0; cursor:pointer; z-index:2}
.switch .tr{position:absolute; inset:0; background:var(--line); border-radius:20px; transition:.2s}
.switch .tr::after{content:''; position:absolute; width:20px; height:20px; border-radius:50%; background:#fff; top:3px; left:3px; transition:.2s; box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch input:checked + .tr{background:var(--g)}
.switch input:checked + .tr::after{transform:translateX(18px)}
[dir=rtl] .switch input:checked + .tr::after{transform:translateX(-18px)}
#sheet{position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:30; display:none; align-items:flex-end; justify-content:center}
#sheet .box{background:var(--card); border-radius:20px 20px 0 0; max-width:520px; width:100%; max-height:86vh; overflow:auto; padding:16px 16px 26px; animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px); opacity:.5}to{transform:none; opacity:1}}
.backdrop{position:fixed; inset:0; z-index:25}
h2{font-size:17px; margin:0}
.mut{color:var(--mut); font-size:13px}
.center{text-align:center}
.editable{min-height:22px; border-bottom:1px dashed var(--line); outline:none; padding:1px 4px}
.editable:focus{border-color:var(--g)}
</style>
</head>
<body>
<div id="wrap">
 <header>

  <div class="card">

  </div>
  <div class="card">

   <div class="rowline"><button class="btn small ghost" id="expBtn"></button><button class="btn small ghost" id="impBtn"></button></div>
   <div class="rowline"><button class="btn small" id="resetBtn" style="background:var(--danger); color:#fff"></button></div>
  </div>
  <div class="card mut center" style="font-size:12px" id="aboutTxt"></div>

</div>

}
function openSheet(h){
 S.sheet=h; save();
 const u=UNITS[h-1];
 let rows='';
 for(let i=1;i<=8;i++){
  const k=h+'-'+i, isDone=!!S.done[k];
  const st=startText(h,i-1);
  rows+=`<div class="trow">
   <button class="tchk ${isDone?'on':''}" data-k="${k}">✓</button>
   <div class="tmeta">
    <div class="fr">${S.lang==='ar'?FR_AR[i-1]:FR_NUM[i-1]} · ${t().thof} ${i}/8</div>
    <div class="ay editable" contenteditable="true" data-k="${k}">${st?esc(st):''}</div>
   </div>
  </div>`;
 }
 $('sheetBox').innerHTML=`
  <div class="sheet-head">
   <div>
    <h2>${t().hizb} ${h} <span class="mut">/ 60 · ${t().juz} ${u.juz}</span></h2>
    <div class="mut" style="margin-top:2px">${esc(u.title)}</div>
   </div>
   <button class="chip" id="shClose">${t().close}</button>
  </div>
  <div style="margin-top:4px">${rows}</div>
  <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
   <button class="btn small" id="shSave" style="background:var(--g);color:#fff">💾 ${t().save}</button>
   <button class="btn small ghost" id="shAll">${t().markall}</button>
   <button class="btn small ghost" id="shNone">${t().unmarkall}</button>
  </div>`;
 $('sheet').style.display='flex';
 $('shClose').onclick=closeSheet;
 $('shSave').onclick=()=>{ collectEdits(); save(); renderAll(); openSheet(h); toast(t().saved); };
 $('shAll').onclick=()=>{ collectEdits(); for(let i=1;i<=8;i++) if(!S.done[h+'-'+i]) S.done[h+'-'+i]=isoDay(new Date()); save(); renderAll(); openSheet(h); };
 $('shNone').onclick=()=>{ collectEdits(); for(let i=1;i<=8;i++) delete S.done[h+'-'+i]; save(); renderAll(); openSheet(h); };
 document.querySelectorAll('.tchk').forEach(c=>c.onclick=()=>{
  collectEdits(); save();
  const k=c.dataset.k;
  if(S.done[k]) delete S.done[k]; else S.done[k]=isoDay(new Date());
  save(); renderAll(); openSheet(h); checkHizbMilestone(h);
 });
}
function collectEdits(){
 document.querySelectorAll('#sheetBox .editable').forEach(ed=>{
  const k=ed.dataset.k, v=ed.textContent.trim();
  if(v) S.edits[k]=v; else delete S.edits[k];
 });
}
function closeSheet(){ S.sheet=null; save(); $('sheet').style.display='none'; }
$('sheet').addEventListener('click',e=>{ if(e.target.id==='sheet') closeSheet(); });

function renderStats(){
 const n=doneCount();
 const st=streak(); if(st>bestStreakCache) bestStreakCache=st;
 const week=last7();
 const cell=(v,l)=>`<div><div class="v num">${v}</div><div class="l">${l}</div></div>`;
 $('statGrid').innerHTML = cell(Math.round(n/8)+'/60',t().hizbs)+cell(st,t().streak)+cell(bestStreakCache,t().best)
  + cell(n,t().total)+cell(week.reduce((a,b)=>a+b,0),t().thWeek)+cell(pace(),t().rate);
 $('t-week').textContent=t().week;
 const wb=$('wbar'); wb.innerHTML='';
 const dn=['D','L','M','X','J','V','S'], ardn=['أحد','اثن','ثلا','أرب','خمي','جمع','سبت'];
 const now=new Date();
 for(let i=6;i>=0;i--){
  const d=new Date(); d.setDate(d.getDate()-i); const k=isoDay(d);
  const c=Object.values(S.done).filter(x=>x===k).length;
  const mx=Math.max(4,...week);
  wb.innerHTML+=`<div class="col"><div class="b" style="height:${Math.max(2,c/mx*56)}px; ${c?'':'background:var(--line)'}"></div><div class="d">${S.lang==='ar'?ardn[d.getDay()]:dn[d.getDay()]}${i===0?'·':''}</div></div>`;
 }
 const rem=480-n, r=pace(), dd=new Date(); dd.setDate(dd.getDate()+Math.ceil(rem/r));
 $('finishInfo').innerHTML = rem>0
  ? `<b>${t().fin}:</b> ${dd.toLocaleDateString(S.lang==='ar'?'ar':S.lang==='en'?'en':'es',{day:'numeric',month:'long',year:'numeric'})}<br>
     <span class="mut">${t().need} ${rem} ${t().th} · ${t().pace1}: ${r}/${t().th}/día (${t().paceDef}: ${S.target})</span>`
  : `<b>🎉 KHATM COMPLETE</b>`;
}
function last7(){
 const out=[]; for(let i=6;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i);
  out.push(Object.values(S.done).filter(x=>x===isoDay(d)).length); } return out;
}
function renderSettings(){
 $('t-notif').textContent=t().notif; $('t-notifsub').textContent=t().notifsub;
 $('t-time').textContent=t().time; $('notifTime').value=S.notif.time;
 $('notifOn').checked=S.notif.on;
 $('t-theme').textContent=t().theme+(S.dark?'':' '+t().themeUse);
 $('darkSw').checked=S.dark;
 $('expBtn').textContent=t().export; $('impBtn').textContent=t().import; $('resetBtn').textContent=t().reset;
 $('aboutTxt').textContent=t().about;
}
function askNotif(){
 if(!('Notification' in window)) return;
 Notification.requestPermission().then(()=>renderAll());
}
function checkRemind(){
 if(!S.notif.on) return;
 const now=new Date(); const hm=now.getHours()+':'+String(now.getMinutes()).padStart(2,'0');
 if(hm < S.notif.time) return;
 const today=isoDay(now); if(S.notif.fired===today) return;
 const c=Object.values(S.done).filter(d=>d===today).length;
 if(c>=S.target) return;
 if('Notification' in window && Notification.permission==='granted'){
  try{ new Notification(t().reminderTitle,{body:`${t().reminderBody} (${c}/${S.target})`}); }catch(e){}
 }
 S.notif.fired=today; save();
}
function toast(msg){
 const el=document.createElement('div');
 el.style.cssText='position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--g);color:#fff;padding:10px 18px;border-radius:14px;z-index:50;font-weight:600;box-shadow:0 4px 18px rgba(0,0,0,.3)';
 el.textContent=msg; document.body.appendChild(el); setTimeout(()=>el.remove(),2600);
}

/* ---------- eventos ---------- */
document.querySelectorAll('.chip[data-l]').forEach(b=>b.onclick=()=>{ S.lang=b.dataset.l; save(); renderAll(); });
$('minusT').onclick=()=>{ S.target=Math.max(1,S.target-1); save(); renderAll(); };
$('plusT').onclick=()=>{ S.target=Math.min(8,S.target+1); save(); renderAll(); };
$('notifOn').onchange=e=>{ S.notif.on=e.target.checked; save(); if(S.notif.on) askNotif(); renderAll(); };
$('notifTime').onchange=e=>{ S.notif.time=e.target.value; S.notif.fired=''; save(); };
$('darkSw').onchange=e=>{ S.dark=e.target.checked; save(); };
$('expBtn').onclick=()=>{
 const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
 const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
 a.download='khatmi-backup-'+isoDay(new Date())+'.json'; a.click();
};
$('impBtn').onclick=()=>$('impFile').click();
$('impFile').onchange=e=>{
 const f=e.target.files[0]; if(!f) return;
 const r=new FileReader();
 r.onload=()=>{ try{ const s=JSON.parse(r.result); if(s.done){ S=Object.assign(S,s); save(); renderAll(); toast(t().saved); } }catch(x){ alert('JSON no válido'); } };
 r.readAsText(f); e.target.value='';
};
$('resetBtn').onclick=()=>{ if(confirm(t().resetConfirm)){ localStorage.removeItem(KEY); location.reload(); } };
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeSheet(); });

/* ---------- arranque ---------- */
(function(){
 document.getElementById('wrap').style.display='block';
 document.getElementById('tabs').style.display='flex';
 // marcar sección visible
 const obs=()=>{ ['today','grid','stats','set'].forEach(x=>$('tab-'+x).style.display = x===S.tab?'block':'none'); };
 setInterval(obs, 300);
 renderAll();
 if(S.sheet) openSheet(S.sheet);
 checkRemind(); setInterval(checkRemind, 60000);
})();
</script>

if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
</script>
